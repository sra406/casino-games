<button class="button button-secondary admin-terminal-link" id="admin-terminal-open" type="button">Open admin terminal</button>
<dialog class="admin-terminal-dialog" id="admin-terminal-dialog" aria-label="Admin terminal">
  <div class="admin-terminal-dialog-bar">
    <div><strong>Admin terminal</strong><span>You keep your seat at this table while it's open.</span></div>

  </div>
  <iframe id="admin-terminal-frame" title="Admin terminal"></iframe>
</dialog>
